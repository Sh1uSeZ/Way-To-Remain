<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="light">
<title>Ways to Remain — Lobby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/mobile.css">
<link rel="stylesheet" href="./css/lobby.css">
</head>
<body>

<div class="lobby">
  <div class="camera" id="camera">
    <div class="board" id="board">
      <img class="board__bg" src="./assets/lobby/passport.png" alt="หนังสือเดินทาง">

      <!-- data-focus-x/y = จุดที่กล้องจะแพนเข้าไปหา (% ของกระดาน) -->
      <button class="card card--ticket card--live" type="button"
              data-focus-x="30.71" data-focus-y="71.67"
              data-goto="./stages/roi-et.html"
              data-label="ร้อยเอ็ด — Roi Et, TH">
        <img src="./assets/lobby/ticket-roiet.png" alt="ตั๋วโดยสาร ปลายทาง ร้อยเอ็ด">
      </button>

      <button class="card card--bangkok card--live" type="button"
              data-focus-x="30.05" data-focus-y="36.06"
              data-goto="./stages/bangkok.html"
              data-label="กรุงเทพฯ — Bangkok, TH">
        <img src="./assets/lobby/stamp-bangkok.png" alt="ตราวีซ่า กรุงเทพ">
      </button>
      <div class="card card--png     card--locked"><img src="./assets/lobby/stamp-png.png"     alt=""></div>
      <button class="card card--japan card--live" type="button"
              data-focus-x="70.56" data-focus-y="73.24"
              data-goto="./stages/japan.html"
              data-label="ญี่ปุ่น — Japan">
        <img src="./assets/lobby/stamp-japan.png" alt="ตราตรวจคนเข้าเมือง ญี่ปุ่น">
      </button>
    </div>
  </div>

  <div class="hint" id="hint"></div>
</div>

<script src="./js/core/touch.js"></script>
<script src="./js/core/audio.js"></script>
<script src="./js/core/transition.js"></script>
<script src="./js/core/parallax.js"></script>
<script src="./js/screens/lobby.js"></script>
</body>
</html>
